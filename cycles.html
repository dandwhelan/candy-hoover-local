<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Wash · pick a cycle</title>
<style>
  /* Hybrid A: minimalist skin on a brutalist frame. Bone paper, hairlines,
     serif headings, sans body; the structure comes from the telemetry panel:
     an oversized countdown with a segmented bar, telemetry cells, numbered
     sections and dial-led tiles. One red, spent only on selection, progress
     and Stop. Numbers and commands are monospace. */
  :root{
    --canvas:#F7F6F3; --paper:#FFFFFF; --sunk:#F1F0EC; --line:#EAEAEA; --line-2:#DEDCD6;
    --ink:#2F3437; --ink-strong:#111111; --muted:#6B6A66;
    --red:#C8102E;          /* 5.4:1 on canvas, 5.9:1 white on it */
    --red-soft:#FBEDEF;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",
           "Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --serif:"Iowan Old Style","Charter","Palatino Linotype","Book Antiqua",Palatino,
            Georgia,"Times New Roman",serif;
    --mono:"SF Mono",ui-monospace,Menlo,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
    --ease:cubic-bezier(.16,1,.3,1);
    --r:10px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);
       font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:56px 32px 176px}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--ink-strong);outline-offset:2px;border-radius:4px}
  button{font:inherit;color:inherit}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* section index: "01 / Status" */
  .idx{display:flex;align-items:baseline;gap:8px;margin:0 0 14px;
       font:500 12px/1.2 var(--mono);color:var(--muted);letter-spacing:.02em}
  .idx b{font-weight:500;color:var(--ink-strong)}
  .idx::after{content:"";flex:1;align-self:center;height:1px;background:var(--line)}

  /* ---------------------------------------------------------- masthead */
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px 32px;
       flex-wrap:wrap;padding-bottom:28px;margin-bottom:48px;border-bottom:1px solid var(--line)}
  .brand{font:500 12px/1.2 var(--mono);color:var(--muted);margin:0 0 10px}
  h1{font-family:var(--serif);font-weight:400;font-size:48px;line-height:1.1;
     letter-spacing:-.03em;margin:0;color:var(--ink-strong)}
  .topbar{display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap}
  .appl{display:flex;gap:6px;align-items:center}
  .navlinks{display:flex;gap:18px;align-items:center}
  .navlinks a{font-size:14px;color:var(--ink);text-decoration:none;
              border-bottom:1px solid var(--line-2);padding:2px 0}
  .navlinks a:hover{border-color:var(--ink)}
  .link{font-size:13px;color:var(--ink);text-decoration:none;
        border:1px solid var(--line);padding:7px 12px;border-radius:6px;
        background:var(--paper);cursor:pointer;transition:border-color .2s,background .2s}
  .link:hover{border-color:var(--line-2);background:var(--sunk)}
  .link:active{transform:scale(.98)}
  #ipPick{font:12.5px var(--mono);color:var(--ink);background:var(--paper);
          border:1px solid var(--line);border-radius:6px;padding:7px 10px;max-width:240px}

  /* ---------------------------------------------------------- status */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px}
  .status{margin-bottom:16px}
  .state{padding:24px 28px 0;overflow:hidden}
  .state .head{display:flex;align-items:center;gap:10px}
  .dot{width:8px;height:8px;border-radius:99px;background:var(--muted);flex:none}
  .dot.busy{background:var(--ink-strong)}
  .dot.err{background:var(--red)}
  @keyframes running{50%{opacity:.25}}
  .state .who{font-family:var(--serif);font-size:24px;line-height:1.2;letter-spacing:-.02em;
              color:var(--ink-strong)}
  .state .detail{color:var(--ink);font-size:14.5px;margin:6px 0 24px}
  /* telemetry cells: temp / rpm / fill / remote, hairline-divided */
  .right{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
         background:var(--paper);border-top:1px solid var(--line);margin:0 -28px}
  .right:empty{display:none}
  /* hairlines drawn as outlines so an empty trailing slot stays paper, not grey */
  .right > span{outline:1px solid var(--line);background:var(--paper);padding:14px 28px 16px;display:flex;flex-direction:column;gap:4px}
  .right small{font:500 11.5px/1.2 var(--mono);color:var(--muted)}
  .right b{font:400 24px/1.1 var(--mono);color:var(--ink-strong);letter-spacing:-.02em;
           font-variant-numeric:tabular-nums}

  /* ---------------------------------------------------------- countdown */
  .timer{padding:24px 28px 28px;margin-bottom:16px}
  .readout{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin:4px 0 22px}
  #tBig{font:300 clamp(4.75rem,20vw,9.5rem)/.86 var(--mono);letter-spacing:-.06em;
        color:var(--ink-strong);font-variant-numeric:tabular-nums}
  #tUnit{font-family:var(--serif);font-size:22px;color:var(--muted);letter-spacing:-.01em}
  /* progress: the same ringFill dash offset, drawn as a straight segmented bar */
  .ring{position:relative;height:14px;background:var(--sunk)}
  .ring svg{display:block;width:100%;height:100%}
  .ring .fill{stroke:var(--red);stroke-width:40;stroke-dasharray:326.7;stroke-dashoffset:326.7;
              transition:stroke-dashoffset .9s linear}
  .ring::after{content:"";position:absolute;inset:0;pointer-events:none;
               background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 2px),var(--paper) calc(5% - 2px) 5%)}
  .scale{display:flex;justify-content:space-between;font:11px/1 var(--mono);color:var(--muted);margin-top:8px}
  .tinfo{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:4px 32px;
         margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
  .tprog{font-family:var(--serif);font-size:24px;line-height:1.15;letter-spacing:-.02em;
         color:var(--ink-strong);grid-row:span 2}
  .tphase{color:var(--ink);font-size:14px}
  .tdone{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

  .stoprow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 8px}
  .stoprow .why{color:var(--muted);font-size:13px}

  /* ---------------------------------------------------------- cycles */
  .cycles{margin-top:72px}
  .leadrow{display:flex;align-items:baseline;gap:12px 20px;flex-wrap:wrap;margin:0 0 20px}
  .lead{margin:0;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.15;
        letter-spacing:-.02em;color:var(--ink-strong)}
  .leadrow select{margin-left:auto;background:var(--paper);color:var(--ink);
       border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;
       font-size:13px;max-width:100%}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;
        background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cyc{outline:1px solid var(--line);background:var(--paper);border:0;padding:18px 18px 16px;cursor:pointer;text-align:left;
       position:relative;display:grid;grid-template-columns:1fr auto;
       grid-template-rows:auto 1fr auto;gap:10px 8px;min-height:164px;
       transition:background .2s,box-shadow .2s}
  .cyc:hover{background:var(--canvas)}
  .cyc:focus-visible{outline:2px solid var(--ink-strong);outline-offset:-4px;border-radius:0}
  .cyc .dial{grid-column:1;grid-row:1;font:300 46px/.85 var(--mono);letter-spacing:-.05em;
             color:var(--ink-strong);font-variant-numeric:tabular-nums}
  .cyc .ico{grid-column:2;grid-row:1;color:var(--muted);align-self:start}
  .cyc .ico svg{display:block}
  .cyc .nm{grid-column:1 / -1;grid-row:2;align-self:end;font-weight:600;font-size:15px;
           line-height:1.3;letter-spacing:-.01em;color:var(--ink-strong)}
  .cyc .meta{grid-column:1 / -1;grid-row:3;font:12px/1.45 var(--mono);color:var(--muted);
             border-top:1px solid var(--line);padding-top:8px}
  .cyc .live{position:absolute;top:18px;right:48px;font:500 11px/1 var(--mono);color:var(--ink-strong);
             border:1px solid var(--ink-strong);padding:4px 6px;border-radius:4px}
  .cyc[aria-pressed="true"]{background:var(--paper);box-shadow:inset 0 0 0 2px var(--red)}
  .cyc[aria-pressed="true"] .dial,.cyc[aria-pressed="true"] .ico{color:var(--red)}

  /* ---------------------------------------------------------- option sheet */
  .sheet{margin-top:40px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
  .sheet header{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;
                padding:28px 32px 24px}
  .sheet header .idx{grid-column:1 / -1;margin:0}
  .sheet header .ico{width:52px;height:52px;border-radius:10px;background:var(--canvas);
                     border:1px solid var(--line);color:var(--ink-strong);display:grid;place-items:center}
  .sheet header h2{margin:0;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;
                   letter-spacing:-.03em;color:var(--ink-strong)}
  .sheet header .sub{color:var(--muted);font:12.5px/1.5 var(--mono);margin-top:8px;
                     display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .opts{padding:0 32px 12px}
  .opt{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px 24px;align-items:start;
       padding:22px 0;border-top:1px solid var(--line)}
  .opt .t{font-size:14px;color:var(--ink-strong);font-weight:600;padding-top:8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line-2);background:var(--paper);color:var(--ink);
        padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1.4;
        font-weight:500;min-width:52px;min-height:40px;font-variant-numeric:tabular-nums;
        transition:border-color .2s,background .2s,color .2s}
  .chip:hover{border-color:var(--ink);background:var(--canvas)}
  .chip:active{transform:scale(.98)}
  .chip[aria-pressed="true"]{border-color:var(--red);color:var(--red);font-weight:600;
                             box-shadow:inset 0 0 0 1px var(--red);background:var(--paper)}
  .chip.mini{min-width:0;min-height:0;padding:3px 10px;font:12px/1.5 var(--sans);border-radius:4px}
  .fixed{color:var(--muted);font-size:14px;padding-top:8px}
  .note{color:var(--muted);font-size:13px;margin-top:12px;display:flex;align-items:center;
        gap:10px;flex-wrap:wrap}
  .field{font:inherit;padding:9px 12px;border-radius:6px;border:1px solid var(--line-2);
         background:var(--paper);color:var(--ink);width:100%;max-width:320px}
  .field + .fixed{margin-top:6px}

  /* ---------------------------------------------------------- action bar */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.94);
       -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
       border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bar .wrap{padding:16px 32px;display:flex;align-items:center;gap:12px 16px}
  .bar .info{min-width:0;flex:1}
  .bar .info .l1{font-weight:600;font-size:14.5px;color:var(--ink-strong);
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .info .l2{margin-top:4px;font:11.5px/1.5 var(--mono);color:var(--muted);
                 background:var(--canvas);border:1px solid var(--line);border-radius:4px;
                 padding:3px 7px;display:block;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .info .l2::before{content:"$ ";color:var(--ink-strong)}
  .btns{display:flex;gap:8px;flex:none}
  .btn{border:1px solid var(--ink-strong);border-radius:6px;padding:12px 24px;font-size:15px;
       font-weight:600;cursor:pointer;background:var(--ink-strong);color:#fff;flex:none;
       transition:background .2s,transform .1s}
  .btn:hover{background:#333}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line-2)}
  .btn.ghost:hover{background:var(--canvas)}
  .btn.stop{background:var(--red);border-color:var(--red);color:#fff;padding:10px 20px;font-size:14px}
  .btn.stop:hover{background:#A50D26}

  .msg{margin-top:20px;padding:14px 16px;border-radius:8px;font-size:14px;
       background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--ink-strong)}
  .msg.bad{border-left-color:var(--red);color:var(--red)}
  .empty{grid-column:1 / -1;color:var(--muted);padding:48px 24px;text-align:center;background:var(--paper)}
  .empty b{color:var(--ink)}

  /* ---------------------------------------------------------- motion */
  @media (prefers-reduced-motion:no-preference){
    .dot.busy{animation:running 1.6s ease-in-out infinite}
    .rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 80ms)}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  }

  /* ---------------------------------------------------------- responsive */
  @media (max-width:720px){
    .tinfo{grid-template-columns:1fr}
    .tprog{grid-row:auto;margin-bottom:6px}
  }
  @media (max-width:600px){
    .wrap{padding:28px 16px 210px}
    .top{padding-bottom:22px;margin-bottom:28px;align-items:flex-start}
    h1{font-size:36px}
    .topbar{width:100%;gap:10px 16px}
    .appl{width:100%}
    #ipPick{flex:1;max-width:none;min-width:0;padding:9px 10px}
    .link{padding:9px 12px}
    .state{padding:20px 20px 0}
    .state .who{font-size:21px}
    .right{margin:0 -20px;grid-template-columns:repeat(2,minmax(0,1fr))}
    .right > span{padding:12px 20px 14px}
    .right b{font-size:20px}
    .timer{padding:20px}
    #tUnit{font-size:18px}
    .tprog{font-size:21px}
    .cycles{margin-top:48px}
    .lead{font-size:24px}
    .leadrow select{margin-left:0;width:100%}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .cyc{padding:14px 12px 12px;min-height:150px}
    .cyc .dial{font-size:38px}
    .cyc .live{top:14px;right:40px}
    .sheet{margin-top:28px}
    .sheet header{padding:20px 18px 18px;gap:14px}
    .sheet header .ico{width:44px;height:44px}
    .sheet header h2{font-size:26px}
    .opts{padding:0 18px 6px}
    .opt{grid-template-columns:1fr;padding:18px 0;gap:10px}
    .opt .t{padding-top:0}
    .fixed{padding-top:0}
    .chip{padding:8px 12px}
    .bar .wrap{padding:12px 16px;flex-wrap:wrap}
    .bar .info{flex:1 1 100%}
    .btns{width:100%}
    .btns .btn{flex:1;padding:13px 16px}
    .btns .btn.ghost{flex:0 0 auto}
  }
  @media (max-width:360px){
    .grid{grid-template-columns:1fr}
  }
</style>

<main class="wrap">
  <header class="top rise" style="--i:0">
    <div>
      <p class="brand">Wash / control</p>
      <h1>Pick a cycle</h1>
    </div>
    <div class="topbar">
      <div class="appl">
        <select id="ipPick" title="Appliance this page is talking to" aria-label="Appliance"></select>
        <button class="link" id="saveIp">Save as default</button>
      </div>
      <nav class="navlinks" aria-label="Other pages">
        <a href="/stats">Stats</a>
        <a href="/advanced">Advanced view</a>
      </nav>
    </div>
  </header>

  <section class="status rise" style="--i:1" aria-label="Machine status">
    <div class="state card" id="state" role="status" aria-live="polite">
      <p class="idx" aria-hidden="true"><b>01</b> / Status</p>
      <div class="head">
        <span class="dot" id="dot" aria-hidden="true"></span>
        <div class="who" id="who">Connecting…</div>
      </div>
      <div class="detail" id="detail">reading the machine</div>
      <div class="right" id="right"></div>
    </div>
  </section>

  <section class="timer card rise" style="--i:2" id="timer" hidden aria-label="Time left">
    <p class="idx" aria-hidden="true"><b>02</b> / Time left</p>
    <div class="readout"><output id="tBig">--</output><span id="tUnit">min left</span></div>
    <div class="ring">
      <svg viewBox="0 0 326.7 20" preserveAspectRatio="none" aria-hidden="true">
        <line class="fill" id="ringFill" x1="0" y1="10" x2="326.7" y2="10"/>
      </svg>
    </div>
    <div class="scale" aria-hidden="true"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
    <div class="tinfo">
      <div class="tprog" id="tProg"></div>
      <div class="tphase" id="tPhase"></div>
      <div class="tdone" id="tDone"></div>
    </div>
  </section>

  <div class="stoprow rise" style="--i:2" id="stopRow" hidden>
    <button class="btn stop" id="stopBtn">Stop wash</button>
    <span class="why" id="stopWhy"></span>
  </div>

  <section class="cycles rise" style="--i:3" aria-labelledby="lead">
    <p class="idx" aria-hidden="true"><b>03</b> / Cycles</p>
    <div class="leadrow">
      <h2 class="lead" id="lead">Cycles</h2>
      <select id="modelPick" title="Which program set to show" aria-label="Program set"></select>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <div id="sheet"></div>
  <div id="msg" role="status" aria-live="polite"></div>
</main>

<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div class="info">
      <div class="l1" id="barName"></div>
      <code class="l2" id="barCmd"></code>
    </div>
    <div class="btns">
      <button class="btn ghost" id="cancel">Cancel</button>
      <button class="btn" id="start">Start wash</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let IP = new URLSearchParams(location.search).get("ip") || "";   // settled in boot()

let DB = null, model = null, live = {}, dec = {}, chosen = null;

// The appliance is polled every 15s, so the countdown is interpolated locally
// between polls and re-synced on each one. cycleTotal is the cycle's full length
// as the server saw it; totalKnown is false when it didn't see the cycle start,
// and then no progress is claimed (the machine only reports time left).
let tickAt = 0, tickSecs = null, cycleTotal = 0, totalKnown = false, typical = null, ticker = null;
let sel = {temp:null, spin:null, soil:null, steam:0, delay:0, opts:0};
let profile = {};

/* ------------------------------------------------------------ icons ---
   Drawn here rather than loaded: the appliance is on a private network and
   the page must work with no internet at all. All 24x24, stroke currentColor. */
const I = {};
const svg = d => '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" ' +
  'stroke-linejoin="round">' + d + "</svg>";

I.cotton = svg('<path d="M8 3 5 5 3 9l3 1v11h12V10l3-1-2-4-3-2"/><path d="M8 3a4 4 0 0 0 8 0"/>');
I.synthetic = svg('<path d="M7 3 4 6l2 3 1-1v13h10V8l1 1 2-3-3-3-4 2z"/>');
I.wool = svg('<path d="M8 16.5a3.6 3.6 0 0 1-.6-7.2 3.1 3.1 0 0 1 5.1-2.2 3.6 3.6 0 0 1 3.9 9.4z"/><path d="M8.6 16.5V19M14.8 16.5V19"/><circle cx="18.2" cy="8.4" r="2.1"/>');
I.delicate = svg('<path d="M20.5 3.5c-1.8 7.6-6.8 11.3-12.4 12.6L4.5 20"/><path d="M20.5 3.5c-6.6.2-11.2 3.5-12.8 8.2a6.2 6.2 0 0 0 .4 4.4"/><path d="M14.4 7c-2.5 1.1-4.5 2.9-5.7 5.4"/>');
I.baby = svg('<circle cx="12" cy="9" r="4.5"/><path d="M10 8h.01M14 8h.01M10.5 11a2.5 2.5 0 0 0 3 0"/><path d="M7 14.5 5.5 21h13L17 14.5"/>');
I.rapid = svg('<path d="M13 2 4.5 13.5H11l-1 8.5 9-12h-6.5z"/>');
I.eco = svg('<path d="M20 4C10 4 4 8.5 4 15a5 5 0 0 0 5 5c6.5 0 11-6 11-16z"/><path d="M4 20c3-6 7-9 12-11"/>');
I.rinse = svg('<path d="M12 3s6 6.5 6 10.5a6 6 0 0 1-12 0C6 9.5 12 3 12 3z"/><path d="M9.5 14a2.5 2.5 0 0 0 2.5 2.5"/>');
I.spin = svg('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/><circle cx="12" cy="12" r="3.2"/>');
I.dry = svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>');
I.steam = svg('<path d="M4 20.5h16"/><path d="M8 16.5c0-1.8 1.8-1.8 1.8-3.6S8 11.1 8 9.3s1.8-1.8 1.8-3.6M14.2 16.5c0-1.8 1.8-1.8 1.8-3.6s-1.8-1.8-1.8-3.6 1.8-1.8 1.8-3.6"/>');

// keyword -> icon, first match wins so order matters
const ICON_RULES = [
  [/off/i, "off"], [/dry|tumbling/i, "dry"], [/steam/i, "steam"],
  [/rapid|59 min|44 min|30 min|14 min/i, "rapid"], [/eco/i, "eco"],
  [/rinse/i, "rinse"], [/spin|drain/i, "spin"], [/wool|silk/i, "wool"],
  [/delicate|hand/i, "delicate"], [/baby/i, "baby"], [/hygiene/i, "hygiene"],
  [/jeans/i, "jeans"], [/total care|care/i, "care"], [/mixed|synthetic|colou?red/i, "mixed"],
  [/cotton/i, "cotton"], [/maintenance/i, "maint"], [/all in one/i, "care"],
];
const iconFor = name => {
  for(const [re, key] of ICON_RULES) if(re.test(name)) return I[key];
  return I.wash;
};

const SOIL = {1:"Light", 2:"Normal", 3:"Intensive", 4:"Extra"};
const TEMPS = [0, 20, 30, 40, 60, 90];
const SPINS = [0, 400, 600, 800, 1000, 1200, 1400, 1600];
const DELAYS = [0, 60, 120, 180, 360, 540, 720];

// The program database names these options but never pins them to bit positions — that is
// model-specific. Offered as suggestions when you name a bit yourself.
const OPTION_SUGGESTIONS = ["Prewash", "Aquaplus", "Anticrease", "Extra dose",
  "Good night", "Hygiene", "Zoom", "Rinse +1", "Rinse +2", "Rinse +3",
  "Steam", "Softener", "Intensive", "Refresh", "Night & day"];

// Bit -> name as documented on a Hoover AWMPD 410LH8/1-S (red_devil "axi" washers), see
// PROTOCOL.md. Other models may differ: a name you give a bit yourself wins.
const DEFAULT_OPTION_NAMES = {1:"Prewash", 2:"Hygiene", 3:"Anti-crease", 4:"Good night",
  5:"Rinse +1", 6:"Rinse +2", 7:"Rinse +3", 8:"AquaPlus", 9:"Zoom"};
// At most one option from each group may be on.
const EXCLUSIVE_OPTIONS = [[1, 2, 4], [5, 6, 7]];

const optName = bit => (profile.options && profile.options[bit]) || DEFAULT_OPTION_NAMES[bit] || "Option " + bit;
function toggleOpt(bit){
  const on = !(sel.opts >> (bit - 1) & 1);
  if(on) EXCLUSIVE_OPTIONS.filter(g => g.includes(bit)).flat()
    .forEach(b => { sel.opts &= ~(1 << (b - 1)); });
  if(on) sel.opts |= 1 << (bit - 1); else sel.opts &= ~(1 << (bit - 1));
}
// Your machine may not be in the program database, so its codes can carry another
// model's names. A name you give a program code wins everywhere.
// your own dial's names win; otherwise a cycle you renamed, then the database's
const nameOf = p => p && (p.fromDial ? p.label : (profile.names && profile.names[p.code]) || p.label);
const allowedBits = p => {
  const o = p.opts;
  if(!o) return [];
  const out = [];
  for(let i = 0; i < 9; i++) if(o >> i & 1) out.push(i + 1);
  return out;
};

function fmt(sec){
  if(sec == null) return ["--", "min left"];
  if(sec <= 0) return ["0", "min left"];
  const m = Math.round(sec / 60);
  if(m >= 60) return [Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"), "h left"];
  return [String(m), "min left"];
}

function renderTimer(){
  const on = dec.running && tickSecs != null;
  $("timer").hidden = !on;
  if(!on) return;

  const left = Math.max(0, tickSecs - (Date.now() - tickAt) / 1000);
  const [big, unit] = fmt(left);
  $("tBig").textContent = big;
  $("tUnit").textContent = unit;

  // Seen from the start: exact. Otherwise estimate from how long this cycle
  // usually takes here, or claim nothing.
  const base = totalKnown ? cycleTotal : typical;
  const total = Math.max(base || 0, left) || 1;
  const done = base ? Math.min(1, Math.max(0, 1 - left / total)) : 0;
  $("ringFill").style.strokeDashoffset = (326.7 * (1 - done)).toFixed(1);

  const now = liveName();
  $("tProg").textContent = now || "Cycle running";
  $("tPhase").textContent = [dec.phase, dec.temperature_c != null ? dec.temperature_c + "°C" : null,
                             dec.spin_rpm ? dec.spin_rpm + " rpm" : null]
                            .filter(Boolean).join(" · ");
  const end = new Date(Date.now() + left * 1000);
  $("tDone").textContent = "Finishes about " +
    end.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) +
    (totalKnown ? " · " + Math.round(done * 100) + "% through"
     : base ? " · about " + Math.round(done * 100) + "% through"
     : " · started before this was being watched, so no progress yet");
}

/* ----------------------------------------------------------- plumbing */
async function api(path, params){
  const qs = new URLSearchParams(params || {}).toString();
  let r;
  try{ r = await fetch(path + (qs ? "?" + qs : "")); }
  catch(e){ throw new Error("Can't reach the local server. Is `python server.py` running?"); }
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const isOff = p => p.family === "OFF" || /(^|_)OFF$/.test(p.key || "") ||
                   /^off$/i.test(p.label || "");

const programsOf = m => m.programs
  .map(s => DB.programs.find(p => p.serial === s))
  .filter(p => p && !isOff(p))
  .sort((a, b) => (a.sel ?? 99) - (b.sel ?? 99));

// Your own dial, once its positions are named (Stats → Identify, or Learn my
// dial). Each position sends *your* number as PrNm. Limits come from the
// database only when the position's program code is known; otherwise the
// cycle runs on the machine's own settings. Remote positions aren't offered.
const DEFAULT = -1;
function myDial(){
  const d = (profile && profile.dial) || {}, size = profile && profile.dialSize;
  return Object.keys(d)
    .filter(pos => d[pos].own && !d[pos].remote && (!size || +pos <= size))
    .sort((a, b) => a - b)
    .flatMap(pos => {
      const e = d[pos];
      const db = e.code != null && DB ? DB.programs.find(p => String(p.code) === String(e.code) && !isOff(p)) : null;
      const c = Object.assign({}, db || {}, {serial: "dial-" + pos, sel: +pos, label: e.label,
                              code: e.code ?? null, fromDial: true, known: !!db});
      // "textTest": true on a position adds a copy that sends your own text as
      // PrStr, the program name some machines show on their display
      return e.textTest ? [c, Object.assign({}, c, {serial: "text-" + pos,
                           label: e.label + " (custom text)", customText: true})] : [c];
    });
}
const cycleList = () => { const mine = myDial(); return mine.length ? mine : programsOf(model); };
function liveName(){
  const d = profile && profile.dial && profile.dial[live.Pr];
  if(d && d.own) return d.label;
  return DB && live.PrCode !== undefined
    ? nameOf(DB.programs.find(p => String(p.code) === String(live.PrCode))) || null : null;
}

// Whatever the machine currently reports for option bit N (status field OptN).
const live_opt = bit => live["Opt" + bit];

/* ------------------------------------------------------------- render */
function renderState(){
  const err = dec.error != null;
  $("dot").className = "dot" + (err ? " err" : dec.running ? " busy" : "");
  $("who").textContent = model && model.model
    ? model.model + (model.type ? " · " + model.type.replace("_", "-") : "")
    : "Washing machine";

  const now = liveName();
  const bits = [];
  if(err) bits.push("Error " + dec.error + (dec.error_text ? " (" + dec.error_text + ")" : ""));
  else bits.push(dec.machine_state || "--");
  if(dec.running && dec.phase) bits.push(dec.phase);
  if(now) bits.push(dec.running ? now : "dial on " + now);
  if(dec.running && dec.remaining_minutes != null){
    const m = dec.remaining_minutes;
    bits.push(m >= 60 ? Math.floor(m / 60) + " h " + (m % 60) + " min left"
                      : m + " min left");
  }
  $("detail").textContent = bits.join(" · ");

  // one telemetry cell per reading: [label, value]
  const r = [];
  if(dec.temperature_c != null) r.push(["Temp", dec.temperature_c + "°C"]);
  if(dec.spin_rpm != null) r.push(["Spin", dec.spin_rpm + " rpm"]);
  if(dec.fill_percent != null && dec.running) r.push(["Fill", dec.fill_percent + "%"]);
  if(dec.remote_control === false) r.push(["Remote", "Off"]);
  $("right").innerHTML = r.map(([k, v]) =>
    "<span><small>" + esc(k) + "</small><b>" + esc(v) + "</b></span>").join("");
}

function renderGrid(){
  const list = cycleList();
  const mine = list.length && list[0].fromDial;
  $("lead").textContent = list.length + (mine ? " cycles on your dial" : " cycles");
  $("modelPick").hidden = !!mine;
  $("grid").innerHTML = list.map(p => {
    const bits = [];
    if(p.fromDial && p.code == null) bits.push("turn the dial here once");
    else if(p.fromDial && !p.known) bits.push("machine's settings");
    if(p.temp !== undefined) bits.push(p.temp === 0 ? "Cold" : p.temp + "°C");
    if(p.spin) bits.push(p.spin + " rpm");
    if(p.duration) bits.push(p.duration + " min");
    const isLive = p.customText ? false
                 : p.fromDial ? String(p.sel) === String(live.Pr)
                              : String(p.code) === String(live.PrCode);
    return '<button class="cyc" data-s="' + p.serial + '" aria-pressed="' +
      (chosen && chosen.serial === p.serial) + '">' +
      '<span class="dial">' + String(p.sel ?? "?").padStart(2, "0") + "</span>" +
      (isLive ? '<span class="live">On dial</span>' : "") +
      '<span class="ico">' + iconFor(nameOf(p)) + "</span>" +
      '<span class="nm">' + esc(nameOf(p)) + "</span>" +
      '<span class="meta">' + esc(bits.join(" · ") || "--") + "</span>" +
      "</button>";
  }).join("");
  $("grid").querySelectorAll(".cyc").forEach(b => {
    b.onclick = () => choose(list.find(p => String(p.serial) === b.dataset.s));
  });
}

function chips(id, values, current, fmt){
  return '<div class="chips">' + values.map(v =>
    '<button class="chip" data-k="' + id + '" data-v="' + v + '" aria-pressed="' +
    (String(v) === String(current)) + '">' + fmt(v) + "</button>").join("") + "</div>";
}

function renderSheet(){
  if(!chosen){ $("sheet").innerHTML = ""; $("bar").hidden = true; return; }
  const p = chosen;
  // a dial cycle can always run on the machine's own settings
  const dflt = p.fromDial ? [DEFAULT] : [];
  const tmax = p.tempMax !== undefined ? p.tempMax : 90;
  const smax = p.spinMax || 1400;
  const lo = p.soilMin ?? 0, hi = p.soilMax ?? 0;

  let soilBlock;
  if(hi > 0 && hi > lo){
    const opts = [];
    for(let v = Math.max(lo, 1); v <= hi; v++) opts.push(v);
    soilBlock = chips("soil", opts, sel.soil, v => SOIL[v] || v);
  }else if(hi > 0){
    soilBlock = '<div class="fixed">Fixed at ' + (SOIL[hi] || hi) + " for this cycle</div>";
  }else{
    soilBlock = '<div class="fixed">This cycle has no soil setting</div>';
  }

  $("sheet").innerHTML =
    '<div class="sheet"><header><p class="idx" aria-hidden="true"><b>04</b> / Options</p><span class="ico">' + iconFor(nameOf(p)) + "</span>" +
      "<div><h2>" + esc(nameOf(p)) + "</h2><div class='sub'>dial position " +
      (p.sel ?? "?") + (p.duration ? " · about " + p.duration + " min" : "") +
      (p.customText ? "" : ' · <button class="chip mini" id="progName">Rename</button>') +
      "</div></div></header><div class='opts'>" +
      (p.customText ? '<div class="opt"><div class="t">Display text</div><div>' +
        '<input id="dispText" maxlength="32" placeholder="' + esc(p.label.replace(/ \(custom text\)$/, "")) +
        '" value="' + esc(sel.text || "") + '" class="field" aria-label="Display text">' +
        '<div class="fixed">Sent as the program name. Shows on the machine only if its display can show text.</div></div></div>' : "") +
      '<div class="opt"><div class="t">Temperature</div>' +
        chips("temp", dflt.concat(TEMPS.filter(t => t <= tmax)), sel.temp,
              v => v === DEFAULT ? "Machine default" : v === 0 ? "Cold" : v + "°") + "</div>" +
      '<div class="opt"><div class="t">Spin speed</div>' +
        chips("spin", dflt.concat(SPINS.filter(v => v <= smax)), sel.spin,
              v => v === DEFAULT ? "Machine default" : v === 0 ? "No spin" : v) + "</div>" +
      '<div class="opt"><div class="t">Soil level</div>' + soilBlock + "</div>" +
      '<div class="opt"><div class="t">Delay start</div>' +
        chips("delay", DELAYS, sel.delay,
              v => v === 0 ? "None" : (v / 60) + " h") + "</div>" +
      '<div class="opt"><div class="t">Extras</div><div>' + optionBlock(p) + "</div></div>" +
    "</div></div>";

  const dispText = $("dispText");
  if(dispText) dispText.oninput = () => { sel.text = dispText.value; renderBar(); };
  $("sheet").querySelectorAll(".chip[data-k]").forEach(c => {
    c.onclick = () => { sel[c.dataset.k] = +c.dataset.v; renderSheet(); renderBar(); };
  });
  $("sheet").querySelectorAll(".chip[data-bit]").forEach(c => {
    c.onclick = () => { toggleOpt(+c.dataset.bit); renderSheet(); renderBar(); };
  });
  const renamer = $("progName");
  if(renamer) renamer.onclick = async () => {
    const name = prompt("What is this cycle called on your machine's panel? " +
                        (p.fromDial ? "" : "Leave empty to go back to \"" + p.label + "\"."),
                        p.fromDial ? p.label : nameOf(p));
    if(name === null) return;
    let saved;
    if(p.fromDial){
      if(!name.trim()) return;       // a dial position keeps a name; rename it instead
      const entry = {}; entry[p.sel] = Object.assign({}, profile.dial[p.sel], {label: name.trim(), own: true});
      saved = {ip: IP, dial: JSON.stringify(entry)};
    }else{
      const patch = {}; patch[p.code] = name.trim();
      saved = {ip: IP, names: JSON.stringify(patch)};
    }
    profile = await api("/api/profile/save", saved);
    chosen = cycleList().find(x => String(x.serial) === String(p.serial)) || chosen;
    renderGrid(); renderSheet(); renderState(); renderTimer();
  };
  const namer = $("optName");
  if(namer) namer.onclick = async () => {
    const bits = allowedBits(chosen);
    const live = bits.filter(b => String(live_opt(b)) === "1");
    const bit = prompt("Which option number? " + bits.join(", ") +
      (live.length ? ". The machine currently has " + live.join(", ") + " on." : ""),
      live[0] || bits[0]);
    if(!bit) return;
    const name = prompt("Name it as it appears on the machine. Suggestions: " +
                        OPTION_SUGGESTIONS.join(", "), optName(bit));
    if(!name) return;
    const patch = {}; patch[bit] = name;
    profile = await api("/api/profile/save",
                        {ip: IP, options: JSON.stringify(patch)});
    renderSheet();
  };
  renderBar();
}

function optionBlock(p){
  const bits = allowedBits(p);
  if(!bits.length) return '<div class="fixed">This cycle takes no extras</div>';
  return '<div class="chips">' + bits.map(b =>
      '<button class="chip" data-bit="' + b + '" aria-pressed="' +
      ((sel.opts >> (b - 1) & 1) === 1) + '">' + esc(optName(b)) + "</button>").join("") +
    '</div><div class="note">Names follow a similar Hoover. If one is wrong, turn it on at ' +
    'the machine, then press Name to label it for this washer. <button class="chip mini" id="optName">Name a button</button></div>';
}

// The shape the official app sends (seen in packet captures). The machine
// picks the program by PrCode: PrNm alone is ignored and it runs whatever it
// was last set to, which is how "Whites" once started Drain + Spin.
function build(){
  const p = chosen;
  const q = ["Write=1", "StSt=1"];
  if(sel.delay > 0) q.push("DelVl=" + Math.round(sel.delay / 30));   // 30-minute steps
  const text = p.customText ? sel.text.trim() || p.label.replace(/ \(custom text\)$/, "") : nameOf(p);
  q.push("PrNm=" + (p.sel ?? 0), "PrCode=" + p.code, "PrStr=" + encodeURIComponent(text));
  if(sel.temp !== null && sel.temp !== DEFAULT) q.push("TmpTgt=" + sel.temp);
  if(sel.soil !== null && (p.soilMax ?? 0) > 0) q.push("SLevTgt=" + sel.soil);
  if(sel.spin !== null && sel.spin !== DEFAULT) q.push("SpdTgt=" + Math.round(sel.spin / 100));
  q.push("OptMsk1=" + (sel.opts || 0), "OptMsk2=0", "Stm=" + (sel.steam || 0));
  return q.join("&");
}

function renderBar(){
  if(!chosen){ $("bar").hidden = true; return; }
  $("bar").hidden = false;
  const bits = [sel.temp === DEFAULT ? "machine's temperature" : sel.temp === 0 ? "Cold" : sel.temp + "°C"];
  if(sel.spin !== null) bits.push(sel.spin === DEFAULT ? "machine's spin" : sel.spin === 0 ? "no spin" : sel.spin + " rpm");
  if(sel.soil !== null && (chosen.soilMax ?? 0) > 0) bits.push((SOIL[sel.soil] || "").toLowerCase());
  if(sel.delay > 0) bits.push("in " + (sel.delay / 60) + " h");
  const on = allowedBits(chosen).filter(b => sel.opts >> (b - 1) & 1);
  if(on.length) bits.push(on.map(optName).join(" + "));
  $("barName").textContent = chosen.label + " · " + bits.filter(Boolean).join(", ");
  $("barCmd").textContent = build();
}

function choose(p){
  chosen = p;
  // your own dial cycles start on the machine's settings; change them if you want
  sel = {
    temp: p.fromDial ? DEFAULT : p.temp !== undefined ? p.temp : 40,
    spin: p.fromDial ? DEFAULT : p.spin !== undefined ? p.spin : 1000,
    soil: (p.soilMax ?? 0) > 0 ? (p.soil ?? p.soilMax) : null,
    steam: 0, delay: 0, text: "",
    opts: allowedBits(p).reduce(
      (m, b) => m | (String(live_opt(b)) === "1" ? 1 << (b - 1) : 0), 0),
  };
  renderGrid(); renderSheet();
  $("sheet").scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* ------------------------------------------------------------ actions */
$("cancel").onclick = () => { chosen = null; renderGrid(); renderSheet(); };

$("start").onclick = async () => {
  if(chosen.code == null){
    // the server learns codes from the status; pick up one learned since load
    try{ profile = await api("/api/profile", {ip: IP}); }catch(e){}
    chosen = cycleList().find(x => String(x.serial) === String(chosen.serial)) || chosen;
    renderGrid(); renderSheet();
  }
  if(chosen.code == null){
    $("msg").innerHTML = '<div class="msg bad">The machine hasn\u2019t told us which program is on position ' +
      esc(chosen.sel) + " yet, and without it the wrong cycle runs. Turn the dial to " + esc(chosen.label) +
      " for a few seconds with this page open, then try again.</div>";
    return;
  }
  const cmd = build();
  if(!confirm("Start the machine?\n\n" + chosen.label + "\n\n" + cmd)) return;
  $("start").disabled = true;
  try{
    const j = await api("/api/command", {ip: IP, params: cmd});
    $("msg").innerHTML = '<div class="msg good">Sent. Machine replied: ' +
      esc(j.response || "(nothing)") + "</div>";
    setTimeout(refresh, 1500);
  }catch(e){
    $("msg").innerHTML = '<div class="msg bad">' + esc(e.message) + "</div>";
  }
  $("start").disabled = false;
};

async function refresh(){
  const j = await api("/api/status", {ip: IP});
  live = {}; dec = j.decoded || {};
  for(const v of Object.values(j.status)) if(v && typeof v === "object") Object.assign(live, v);

  if(dec.running && dec.remaining_seconds != null){
    tickSecs = dec.remaining_seconds;
    tickAt = Date.now();
    cycleTotal = (j.cycle && j.cycle.total_seconds) || tickSecs;
    totalKnown = !!(j.cycle && j.cycle.from_start);
    typical = (j.cycle && j.cycle.typical_seconds) || null;
    if(!ticker) ticker = setInterval(renderTimer, 1000);
  }else{
    tickSecs = null; cycleTotal = 0; totalKnown = false; typical = null;
    if(ticker){ clearInterval(ticker); ticker = null; }
  }
  renderState();
  renderTimer();
  renderStop();
  if(model) renderGrid();
}

// Running, paused, or waiting on a delayed start: all can be cancelled.
const ACTIVE = ["2", "3", "4", "5"];
function renderStop(){
  const active = ACTIVE.includes(String(live.MachMd));
  $("stopRow").hidden = !active;
  if(!active) return;
  const remote = String(live.WiFiStatus) === "1";
  $("stopBtn").disabled = !remote;
  $("stopWhy").textContent = remote ? ""
    : "Remote control is off on the machine, so it won't take a stop from here.";
}

// What the Home Assistant integration sends: StSt=0 on the running position.
$("stopBtn").onclick = async () => {
  const name = liveName() || "the current cycle";
  if(!confirm("Stop " + name + "?\n\nThe machine may still need to drain before " +
              "the door unlocks. Run Drain + Spin if water is left in the drum.")) return;
  const cmd = "Write=1&StSt=0&PrNm=" + (live.Pr ?? 0) + "&DelVl=0";
  $("stopBtn").disabled = true;
  try{
    const j = await api("/api/command", {ip: IP, params: cmd});
    $("msg").innerHTML = '<div class="msg good">Stop sent. Machine replied: ' +
      esc(j.response || "(nothing)") + "</div>";
    setTimeout(refresh, 2000);
  }catch(e){
    $("msg").innerHTML = '<div class="msg bad">' + esc(e.message) + "</div>";
    $("stopBtn").disabled = false;
  }
};

let savedIp = "";

// Appliances we have talked to before, so switching back is one click.
async function renderIpPicker(){
  let known = [];
  try{
    const r = await api("/api/appliances");
    known = r.appliances || [];
    savedIp = r.default || "";
  }catch(e){}

  const ips = known.map(a => a.ip);
  if(IP && !ips.includes(IP)){ known.unshift({ip: IP, model: ""}); ips.unshift(IP); }

  $("ipPick").innerHTML =
    (known.length
      ? known.map(a => '<option value="' + esc(a.ip) + '">' + esc(a.ip) +
          (a.model ? " · " + esc(a.model) : "") +
          (a.ip === savedIp ? "  ★" : "") + "</option>").join("")
      : '<option value="">no appliance yet</option>') +
    '<option value="__new">Enter an IP…</option>';
  if(IP) $("ipPick").value = IP;

  $("ipPick").onchange = async () => {
    let v = $("ipPick").value;
    if(v === "__new"){
      v = (prompt("Appliance IP on your network", IP || "192.168.") || "").trim();
      if(!v){ $("ipPick").value = IP; return; }
    }
    IP = v;
    const u = new URL(location.href);
    u.searchParams.set("ip", IP);
    history.replaceState({}, "", u);
    location.reload();
  };

  const isDefault = IP && IP === savedIp;
  $("saveIp").textContent = isDefault ? "Default ★" : "Save as default";
  $("saveIp").title = isDefault ? "Click to forget this default"
                                : "Open every page on this appliance";
  $("saveIp").onclick = async () => {
    if(!IP){ alert("Pick an appliance first."); return; }
    if(isDefault) await api("/api/settings/forget");
    else await api("/api/settings/save", {ip: IP});
    await renderIpPicker();
  };
}

async function boot(){
  try{ savedIp = (await api("/api/settings")).ip || ""; }catch(e){}
  if(!IP) IP = savedIp;
  await renderIpPicker();

  if(!IP){
    $("grid").innerHTML = '<div class="empty">No appliance yet. Pick ' +
      '<b>Enter an IP…</b> above, or use the ' +
      '<a href="/advanced">advanced view</a> to scan for it.</div>';
    $("who").textContent = "Not connected";
    $("detail").textContent = "";
    return;
  }
  try{
    DB = await fetch("/programs.json").then(r => r.json());
    const id = await api("/api/identify", {ip: IP});
    const prof = await api("/api/profile", {ip: IP}).catch(() => ({}));
    profile = prof || {};
    const want = prof.model || (id.candidates[0] && id.candidates[0].id);
    model = DB.models.find(m => m.id === want) || DB.models[0];
    const washers = DB.models.filter(m =>
      m.families.some(f => ["WA_PROG", "DUAL_WM_WD", "NFC_PROGRAM"].includes(f)));
    $("modelPick").innerHTML = washers.map(m =>
      '<option value="' + m.id + '">' + esc(m.model || m.id.slice(0, 8)) +
      " · " + (m.type || "").replace("_", "-") + " · " + m.count + " programs</option>").join("");
    $("modelPick").value = model.id;
    $("modelPick").onchange = async () => {
      model = DB.models.find(m => m.id === $("modelPick").value);
      chosen = null; renderSheet(); renderGrid();
      await api("/api/profile/save", {ip: IP, model: model.id}).catch(() => {});
    };
    await refresh();
    renderGrid();
    setInterval(refresh, 15000);   // the appliance is a tiny embedded server
  }catch(e){
    $("dot").className = "dot err";
    $("who").textContent = IP + " is not responding";
    $("detail").textContent = "";
    $("grid").innerHTML = '<div class="empty">' + esc(e.message) +
      '<br><br><button class="link" onclick="location.reload()">Try again</button></div>';
  }
}
boot();
</script>
